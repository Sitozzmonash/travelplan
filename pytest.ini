[pytest]
# 只收集本项目的 tests/：super_harness/ 是 vendored 的 submodule，它自己的
# tests/__init__.py 会让 pytest 把 `super_harness/tests` 当成顶层包 `tests` 导入，
# 于是 `tests/test_workflow.py` 两个同名文件撞成 "import file mismatch"，
# 根目录直接跑 pytest 会 11 个 collection error（子模块内的文件不能动）。
testpaths = tests
# importlib 模式按文件路径导入，不依赖 __init__.py 推导包名，从根上避免同名撞车。
addopts = --import-mode=importlib
